name: "Release Tauri App"

on:
  push:
    tags:
      - "v*" # S'active lorsqu'un tag de version (ex. v1.1.0) est poussé sur repo

jobs:
  build-and-release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installation de Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Installation des dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Installation des paquets Node.js (Vite)
        run: npm install

      - name: Compilation et publication de l'application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Voxura Launcher ${{ github.ref_name }}"
          releaseBody: "Voir les assets ci-dessous pour télécharger le launcher pour votre plateforme."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
